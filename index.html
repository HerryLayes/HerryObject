<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>HerryObject</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ГЛАВНЫЙ ЭКРАН -->
<div class="overlay">
  <h1 class="logo">HerryObject</h1>

  <div class="buttons">
    <button class="main-btn" id="openModal">Create Account</button>
    <button class="outline-btn">Sign In</button>
  </div>
</div>

<!-- МОДАЛКА (скрыта по умолчанию) -->
<div id="modal" class="modal hidden">
  <div class="modal-content">

    <div class="modal-header">
      <span id="closeModal">&times;</span>
      <h2>Create Account</h2>
    </div>

    <div class="divider"></div>

    <div class="modal-body">

  <label>Username</label>
  <input id="usernameInput" type="text" placeholder="Don't use your real name">

  <label>Password</label>
  <input id="passwordInput" type="password" placeholder="At least 8 characters">

  <button id="createBtn" class="create-btn disabled" disabled>
    Create Account
  </button>

  <p id="errorText" class="error hidden"></p>

</div>

  </div>
</div>

<script src="script.js"></script>
</body>
</html>
